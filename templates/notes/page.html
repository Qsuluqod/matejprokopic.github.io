{% extends "base.html" %}

{% block content %}

{% set parent_path = page.ancestors | last %}
{% set notes = get_section(path=parent_path) %}

<div class="notes-layout">

    {% include "notes/sidebar.html" %}

    <article class="notes-content">
        <h1>{{ page.title }}</h1>

        {{ page.content | safe }}
    </article>

</div>

{% endblock content %}
